name: Revv
description: >-
  Revv (formerly RevvSales) is a document automation and electronic-signature
  platform that helps businesses prepare, automate, and execute business
  paperwork such as sales contracts, proposals, and agreements. The product
  offers 1,000+ customizable document templates, drag-and-drop editing,
  rule-based approval workflows, eSignatures with audit trails, real-time
  collaboration, and analytics, plus integrations with Salesforce, HubSpot,
  Google Sheets, and Zapier alongside a native REST API. Founded in India and
  backed by Lightspeed Venture Partners, Revv was acquired by LegalZoom; its
  standalone developer and API-documentation subdomains (apidocs.revv.so,
  docs.revv.so, help.revv.so) now redirect into the LegalZoom application, so no
  independently documented Revv API specification is currently published.
