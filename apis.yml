name: Revv
description: >-
  Revv (formerly RevvSales) is a document automation and electronic-signature
  platform that helps businesses prepare, automate, and execute business
  paperwork such as sales contracts, proposals, and agreements. The product
  offers 1,000+ customizable document templates, drag-and-drop editing,
  rule-based approval workflows, eSignatures with audit trails, real-time
  collaboration, and analytics, plus integrations with Salesforce, HubSpot,
  Google Sheets, and Zapier alongside a native REST API. Founded in India and
  backed by Lightspeed Venture Partners, Revv was acquired by LegalZoom
  (announced 2022-10-17). The marketing site still sells the API and publishes a
  per-document price list ($4.00 / $2.00 / $1.50 by annual volume, OAuth 2.0,
  webhooks, API logs, free sandbox accounts), but every developer surface behind
  it is gone: the API reference host build.revv.so returns 404 from a
  Postman-hosted "Not found" page, all ~200 www.revv.so/docs/* help articles
  still listed in the sitemap return nginx 502, and the api., apidocs., docs.,
  help. and app. subdomains all serve the LegalZoom application shell. No Revv
  OpenAPI, AsyncAPI, GraphQL SDL, Postman collection, MCP server or agent card
  is published anywhere.
