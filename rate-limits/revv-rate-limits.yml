note: >-
  Revv publishes no rate limits. The API-pricing page meters the API by documents
  generated per year (a commercial quota, not a request-rate limit) and lists "API Logs"
  as a plan feature, but names no per-second/per-minute request ceiling, no burst, and no
  response headers. The pages that would carry runtime limits are gone: the developer API
  reference at https://build.revv.so (named as the documentation home in Revv's own API
  pricing FAQ) returns 404 from a Postman-hosted "Not found" page, and every
  https://www.revv.so/docs/* help article — including /docs/authenticate-your-revv-api,
  which is still listed in the site sitemap — returns nginx 502 Bad Gateway. An honest
  zero: nothing about throttling is published anywhere reachable.
