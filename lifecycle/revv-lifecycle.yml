note: >-
  This file records a retirement, not a policy. Revv publishes no versioning policy, no
  deprecation policy, no Sunset/Deprecation header commitment, no SLA and no status page —
  and the surfaces that would carry them no longer answer. Revv was acquired by LegalZoom
  (announced 2022-10-17) and the developer surface has since been withdrawn without any
  published deprecation notice: the API reference host named in Revv's own API pricing FAQ
  (https://build.revv.so) returns 404 from a Postman-hosted "Not found" page, every one of
  the ~200 https://www.revv.so/docs/* help articles still listed in sitemap.xml returns
  nginx 502, the api./apidocs./docs./help./app. subdomains all serve the LegalZoom
  single-page-app shell, and the apex https://revv.so has an A record (52.2.145.180) that
  times out on both 80 and 443. What remains live is the Webflow marketing site at
  www.revv.so, last published 2021-12-06, which still sells the API and its per-document
  price list. No StatusPage or Deprecation pointer is emitted — neither exists.
