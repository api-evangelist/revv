note: >-
  Revv publishes a volume-tiered API price list on its developer API-pricing page:
  API usage is charged per document generated, in three annual-volume bands. There is no
  self-serve API plan with a stated monthly price — the page directs buyers to sign up
  free and says "just let us know your requirements and we will create a plan for you".
  The main product pricing page (pricing.html) publishes NO tiers at all: it is a
  feature comparison plus a "TALK TO US" custom-quote motion. A free plan and a 14-day
  paid trial are advertised, and free sandbox accounts are offered before going live.
  Prices captured verbatim from the live page on 2026-08-14; the page is part of a
  Webflow marketing site last published 2021-12-06 and carries a LegalZoom-acquisition
  banner, so these figures may no longer be transactable.
